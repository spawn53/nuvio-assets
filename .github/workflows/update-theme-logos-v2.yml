name: Update Nuvio Theme Logos v2

on:
  push:
    paths:
      - ".github/workflows/update-theme-logos-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified logo package
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-2658-81f4-ae35-53151e7db106/raw?se=2026-10-04T15%3A00%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=ed030b8e-5d76-5edb-953f-c3af6a71db30&skoid=b971d227-1348-4524-8797-edb0fdf15147&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T04%3A38%3A55Z&ske=2026-10-05T04%3A38%3A55Z&sks=b&skv=2026-02-06&sig=jWBeydc0euwZQAmf9OjT8udicwHzxJdSZuPpjdXoAag%3D' -o /tmp/nuvio-logo-v2.zip
          echo "5ec9f52b5662c1029612fcd350d3d022d3c4c543a824adc320f18f885753ef3a  /tmp/nuvio-logo-v2.zip" | sha256sum -c -
          unzip -o /tmp/nuvio-logo-v2.zip -d .

      - name: Verify all ten logos
        shell: bash
        run: |
          set -euo pipefail
          test -f themes/time-travel/logo-v2.webp
          test -f themes/artificial-intelligence/logo-v2.webp
          test -f themes/parallel-worlds/logo-v2.webp
          test -f themes/alternate-reality/logo-v2.webp
          test -f themes/dystopia/logo-v2.webp
          test -f themes/space/logo-v2.webp
          test -f themes/cyberpunk/logo-v2.webp
          test -f themes/post-apocalyptic/logo-v2.webp
          test -f themes/aliens-first-contact/logo-v2.webp
          test -f themes/human-vs-technology/logo-v2.webp

      - name: Commit logos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themes/*/logo-v2.webp
          git commit -m "Add Nuvio theme logos v2"
          git push
