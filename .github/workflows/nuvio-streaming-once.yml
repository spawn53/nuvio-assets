name: Streaming assets one-shot builder
on:
  push:
    branches:
      - artwork/streaming-services-20261013
    paths:
      - .github/workflows/nuvio-streaming-once.yml
      - scripts/build_streaming_services_artwork.py
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate original-source logo compositions and check dimensions
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0 cairosvg==2.8.2 requests==2.32.5
          python scripts/build_streaming_services_artwork.py
      - name: Commit results and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streaming-services/
          git rm --ignore-unmatch .github/workflows/nuvio-streaming-once.yml
          git commit -m "Artwork: generate 14 streaming service asset sets [skip ci]"
          git push origin HEAD:artwork/streaming-services-20261013
