name: Update Nuvio Theme Logos v2 Patch

on:
  push:
    paths:
      - ".github/workflows/update-theme-logos-v2-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified logo patch
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-8088-820a-bf9b-9fff65d612a3/raw?se=2026-10-04T15%3A47%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=e847ed93-4748-5cca-9c7a-d2d2889717f9&skoid=b971d227-1348-4524-8797-edb0fdf15147&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T05%3A17%3A41Z&ske=2026-10-05T05%3A17%3A41Z&sks=b&skv=2026-02-06&sig=Dv9Git6W9PpRdbHKYO8sDiGcGgIB6mdZ3kVSo87zz9g%3D' -o /tmp/nuvio-logo-v2-patch.zip
          echo "5c6693f19426cc5478484a7c4977a70b137bfc457b8167c57cc0310068c4e1d5  /tmp/nuvio-logo-v2-patch.zip" | sha256sum -c -
          unzip -o /tmp/nuvio-logo-v2-patch.zip -d .

      - name: Verify logo patch
        shell: bash
        run: |
          set -euo pipefail
          test -f themes/road-themed/logo-v2.webp
          test -f themes/revenge/logo-v2.webp
          test -f themes/dreams-reality/logo-v2.webp
          test -f themes/superhero/logo-v2.webp

      - name: Commit final logo patch and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/update-theme-logos-v2-patch.yml
          git add themes/road-themed/logo-v2.webp themes/revenge/logo-v2.webp themes/dreams-reality/logo-v2.webp themes/superhero/logo-v2.webp
          git add -u .github/workflows/update-theme-logos-v2-patch.yml
          git commit -m "Add refined Nuvio theme logos v2"
          git push
