name: Production Studios brand identity QC corrections
on:
  push:
    branches: [artwork/production-studios-20261013]
    paths: [.github/workflows/nuvio-studios-fix-one-shot.yml]
permissions:
  contents: write
jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Correct logo-source misidentification
        run: |
          python -m pip install -q pillow==11.3.0 cairosvg==2.8.2 requests==2.32.5 beautifulsoup4==4.13.4
          python scripts/fix_production_studios_sources.py
      - name: Commit QC
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production-studios/
          git rm --ignore-unmatch .github/workflows/nuvio-studios-fix-one-shot.yml
          git commit -m "QC: fix Sky Studios identity and verify official ITV Pathé logos [skip ci]"
          git pull --rebase origin artwork/production-studios-20261013
          git push origin HEAD:artwork/production-studios-20261013
