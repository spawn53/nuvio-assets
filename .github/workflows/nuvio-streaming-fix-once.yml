name: Streaming artwork contrast fix one-shot
on:
  push:
    branches: [artwork/streaming-services-20261013]
    paths:
      - .github/workflows/nuvio-streaming-fix-once.yml
      - scripts/fix_streaming_contrast.py
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Improve visibility of official-source logos
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0 cairosvg==2.8.2 requests==2.32.5
          python scripts/fix_streaming_contrast.py
      - name: Commit checked assets and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streaming-services/
          git rm --ignore-unmatch .github/workflows/nuvio-streaming-fix-once.yml
          git commit -m "QC: correct black-on-black streaming logos [skip ci]"
          git push origin HEAD:artwork/streaming-services-20261013
