name: TIMSBI studio contrast polish
on:
  push:
    branches: [artwork/production-studios-official-upgrade-20261013]
    paths: [.github/workflows/production-studios-timsbi-qc-once.yml]
permissions:
  contents: write
jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Fix dark wordmark subtitle
        run: |
          python -m pip install -q pillow==11.3.0 numpy==2.3.4 requests==2.32.5 cairosvg==2.8.2
          python scripts/fix_timsbi_subtitle.py
      - name: Commit final v2 assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production-studios/
          git rm --ignore-unmatch .github/workflows/production-studios-timsbi-qc-once.yml
          git commit -m "QC: polish TIMSBI secondary wordmark legibility [skip ci]"
          git pull --rebase origin artwork/production-studios-official-upgrade-20261013
          git push origin HEAD:artwork/production-studios-official-upgrade-20261013
