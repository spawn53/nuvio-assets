name: Build 23 Production Studios artwork sets
on:
  push:
    branches: [artwork/production-studios-20261013]
    paths:
      - .github/workflows/nuvio-studios-one-shot.yml
      - scripts/build_production_studios_artwork.py
permissions:
  contents: write
jobs:
  artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve first-party logos and generate poster/logo/hover
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0 cairosvg==2.8.2 requests==2.32.5 beautifulsoup4==4.13.4
          python scripts/build_production_studios_artwork.py
      - name: Commit outputs and clean one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production-studios/
          git rm --ignore-unmatch .github/workflows/nuvio-studios-one-shot.yml
          git commit -m "Production Studios: add 23 original-source poster/logo/hover sets [skip ci]"
          git pull --rebase origin artwork/production-studios-20261013
          git push origin HEAD:artwork/production-studios-20261013
